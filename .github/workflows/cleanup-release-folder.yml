name: Cleanup repository release folder

on:
  push:
    paths:
      - '.github/workflows/cleanup-release-folder.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove repository release folder and clarify public ELF distribution
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('- private console captures and firmware-specific addresses are kept outside the public source tree.', '- console captures and firmware-specific addresses are kept outside the public source tree.')
          s = s.replace('release/    optional prebuilt release artifact and checksum\n', '')
          old = '''## Prebuilt ELF

When included in `release/`, the prebuilt ELF corresponds to the v0.8 Resource Chain Correlation Graph build. A SHA-256 file is supplied beside it so the artifact can be verified independently.

The public prebuilt ELF is stripped of compiler debug information that exposes local build paths; runtime code and the embedded mapper version remain intact.
'''
          new = '''## Official public prebuilt ELF

The official **MM PS5 API Mapper v0.8** prebuilt ELF is publicly distributed through the GitHub **Releases** page rather than stored inside the source tree.

Release: [`v0.8 — Resource Chain Correlation Graph`](https://github.com/Michele-M-Media/MM-PS5-API-MAPPER/releases/tag/v0.8)

Official asset:

```text
mm_ps5_api_mapper_v0.8_resource_chain_correlation_graph.elf
```

SHA-256:

```text
2adb6cd3967ec25b5bb93021506cd0360ae254b709d43e66a6b496315fd15a18
```

A matching `.sha256` file is attached to the same public GitHub Release. The release ELF is the official downloadable v0.8 prebuilt; it is not a private artifact.
'''
          if old not in s:
              raise SystemExit('Expected Prebuilt ELF section not found')
          s = s.replace(old, new)
          s = s.replace('The clean source repository intentionally contains **no private console capture, local IP, firmware-specific address dump, or personal hardware baseline**.', 'The clean source repository intentionally contains **no console captures, local IPs, firmware-specific address dumps, or personal hardware baselines**. Those test artifacts are simply kept separate from the public source code; the official prebuilt ELF remains publicly available from GitHub Releases.')
          p.write_text(s)
          PY
          git config user.name 'Michele-M-Media'
          git config user.email '197989904+Michele-M-Media@users.noreply.github.com'
          git add -A README.md release
          git commit -m 'Remove repository release folder and clarify public prebuilt ELF'
          git push origin HEAD:main
