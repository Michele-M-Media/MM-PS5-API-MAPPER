name: Build MM PS5 WEB APP STUDIO v0.1.1 Windows EXE

on:
  push:
    paths:
      - '.github/workflows/build-mm-web-app-studio-v011.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct previous source snapshot
        shell: pwsh
        run: |
          git show a60593a6d701cc05da94f1cdb53cbbd4057d4bfe:.github/workflows/build-mm-web-app-studio-exe.yml | Out-File old-workflow.yml -Encoding utf8
          $extract = @'
          from pathlib import Path
          text = Path("old-workflow.yml").read_text(encoding="utf-8")
          start = text.index("      - name: Reconstruct MM PS5 WEB APP STUDIO source")
          run = text.index("        run: |", start)
          body_start = text.index("\n", run) + 1
          end = text.index("\n      - name: Install build dependencies", body_start)
          body = text[body_start:end]
          lines = []
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith("          ") else line)
          Path("reconstruct.ps1").write_text("\n".join(lines), encoding="utf-8")
          '@
          Set-Content extract_reconstruct.py $extract -Encoding utf8
          python extract_reconstruct.py
          & .\reconstruct.ps1
          New-Item -ItemType Directory -Force -Path mmstudio | Out-Null
          Set-Content mmstudio/__init__.py '__version__ = "0.1.1"' -Encoding utf8
          $main = Get-Content 'MM-PS5-WEB-APP-STUDIO.py' -Raw
          $main = $main.Replace('v0.1 FOUNDATION','v0.1.1 PACKAGING REPAIR')
          Set-Content 'MM-PS5-WEB-APP-STUDIO.py' $main -Encoding utf8

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: Build standalone Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "MM-PS5-WEB-APP-STUDIO-v0.1.1" --paths . --hidden-import mmstudio.builder --collect-submodules mmstudio --add-data "runtime;runtime" "MM-PS5-WEB-APP-STUDIO.py"

      - name: Validate bundled module and PE executable
        shell: pwsh
        run: |
          $exe = 'dist/MM-PS5-WEB-APP-STUDIO-v0.1.1.exe'
          if (!(Test-Path $exe)) { throw 'EXE missing' }
          $bytes = [IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Not a valid PE/MZ executable' }
          $analysis = Get-Content 'build/MM-PS5-WEB-APP-STUDIO-v0.1.1/Analysis-00.toc' -Raw
          if ($analysis -notmatch 'mmstudio.builder') { throw 'mmstudio.builder was not bundled' }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          'MM PS5 WEB APP STUDIO v0.1.1' | Out-File dist/BUILD-INFO.txt -Encoding utf8
          'PACKAGING_REPAIR=PASS' | Out-File dist/BUILD-INFO.txt -Append -Encoding utf8
          'MMSTUDIO_BUILDER_BUNDLED=PASS' | Out-File dist/BUILD-INFO.txt -Append -Encoding utf8
          'PE_MZ_VALIDATION=PASS' | Out-File dist/BUILD-INFO.txt -Append -Encoding utf8
          "SHA256=$sha" | Out-File dist/BUILD-INFO.txt -Append -Encoding utf8
          "SIZE=$($bytes.Length)" | Out-File dist/BUILD-INFO.txt -Append -Encoding utf8
          Get-Content dist/BUILD-INFO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MM-PS5-WEB-APP-STUDIO-v0.1.1-WINDOWS
          path: |
            dist/MM-PS5-WEB-APP-STUDIO-v0.1.1.exe
            dist/BUILD-INFO.txt
          if-no-files-found: error
          compression-level: 0
