name: Build MM PS5 WEB APP STUDIO v0.1.2 Windows EXE

on:
  push:
    paths:
      - '.github/workflows/build-mm-web-app-studio-v012.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct monolithic source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime | Out-Null
          $src = [Convert]::FromBase64String('')
          $r1 = [Convert]::FromBase64String('')
          $r2 = [Convert]::FromBase64String('')
          [IO.File]::WriteAllBytes('src.py.gz', $src)
          [IO.File]::WriteAllBytes('r1.gz', $r1)
          [IO.File]::WriteAllBytes('r2.gz', $r2)
          python -c "import gzip;open('MM-PS5-WEB-APP-STUDIO.py','wb').write(gzip.open('src.py.gz','rb').read());open('runtime/mm_ps5_input.js','wb').write(gzip.open('r1.gz','rb').read());open('runtime/mm_ps5_runtime.js','wb').write(gzip.open('r2.gz','rb').read())"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: Build standalone Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "MM-PS5-WEB-APP-STUDIO-v0.1.2" --add-data "runtime;runtime" "MM-PS5-WEB-APP-STUDIO.py"

      - name: Execute packaged EXE self-test
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist/MM-PS5-WEB-APP-STUDIO-v0.1.2.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -WorkingDirectory (Split-Path $exe) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "EXE self-test returned $($p.ExitCode)" }
          $marker = 'dist/SELF-TEST-PASS.txt'
          if (!(Test-Path $marker)) { throw 'EXE did not create SELF-TEST-PASS.txt' }
          $text = Get-Content $marker -Raw
          if ($text -notmatch 'SELF_TEST=PASS') { throw 'EXE self-test marker invalid' }
          if ($text -notmatch 'MONOLITHIC_BUILDER=PASS') { throw 'Monolithic builder self-test missing' }

      - name: Validate PE and hash
        shell: pwsh
        run: |
          $exe = 'dist/MM-PS5-WEB-APP-STUDIO-v0.1.2.exe'
          $bytes = [IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Not a valid PE/MZ executable' }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          'MM PS5 WEB APP STUDIO v0.1.2' | Out-File dist/BUILD-INFO.txt -Encoding utf8
          'MONOLITHIC_BUILDER=PASS' | Out-File dist/BUILD-INFO.txt -Append -Encoding utf8
          'EXE_SELF_TEST=PASS' | Out-File dist/BUILD-INFO.txt -Append -Encoding utf8
          'PE_MZ_VALIDATION=PASS' | Out-File dist/BUILD-INFO.txt -Append -Encoding utf8
          "SHA256=$sha" | Out-File dist/BUILD-INFO.txt -Append -Encoding utf8
          "SIZE=$($bytes.Length)" | Out-File dist/BUILD-INFO.txt -Append -Encoding utf8
          Get-Content dist/BUILD-INFO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MM-PS5-WEB-APP-STUDIO-v0.1.2-WINDOWS
          path: |
            dist/MM-PS5-WEB-APP-STUDIO-v0.1.2.exe
            dist/BUILD-INFO.txt
            dist/SELF-TEST-PASS.txt
          if-no-files-found: error
          compression-level: 0
