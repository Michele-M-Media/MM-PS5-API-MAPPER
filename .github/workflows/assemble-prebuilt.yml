name: Assemble prebuilt v0.8

on:
  push:
    paths:
      - 'release/.elfparts/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify prebuilt
        shell: bash
        run: |
          set -euo pipefail
          test -f release/.elfparts/part-06.b64
          echo 'CHUNK_SHA256_BEGIN'
          sha256sum release/.elfparts/part-*.b64
          echo 'CHUNK_SHA256_END'
          cat release/.elfparts/part-*.b64 | base64 -d > release/MM-PS5-API-MAPPER-v0.8-PREBUILT-ELF.zip
          echo 'REBUILT_ZIP_SHA256'
          sha256sum release/MM-PS5-API-MAPPER-v0.8-PREBUILT-ELF.zip
          echo 'f72aa0d9b0172217376824146a8676488b06c17c7a2dd343dc1e832351d3aaff  release/MM-PS5-API-MAPPER-v0.8-PREBUILT-ELF.zip' | sha256sum -c -
          unzip -p release/MM-PS5-API-MAPPER-v0.8-PREBUILT-ELF.zip mm_ps5_api_mapper_v0.8_resource_chain_correlation_graph.elf | sha256sum | grep '^2adb6cd3967ec25b5bb93021506cd0360ae254b709d43e66a6b496315fd15a18  -$'
      - name: Commit clean release artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release/.elfparts
          git config user.name 'Michele-M-Media'
          git config user.email '197989904+Michele-M-Media@users.noreply.github.com'
          git add -A release
          git commit -m 'Add verified MM PS5 API Mapper v0.8 prebuilt ELF' || exit 0
          git push origin HEAD:main
