name: Build MM PS5 WEB APP STUDIO Windows EXE

on:
  push:
    paths:
      - '.github/workflows/build-mm-web-app-studio-exe.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct MM PS5 WEB APP STUDIO source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path mmstudio, runtime | Out-Null
          $b64 = @'
          
          '@ -replace "`r|`n", ""
          [IO.File]::WriteAllBytes("MM-PS5-WEB-APP-STUDIO.py", [Convert]::FromBase64String($b64))
          $b64 = @'
          X192ZXJzaW9uX18gPSAiMC4xLjAiCg==
          '@ -replace "`r|`n", ""
          [IO.File]::WriteAllBytes("mmstudio\__init__.py", [Convert]::FromBase64String($b64))
          $b64 = @'
          
          '@ -replace "`r|`n", ""
          [IO.File]::WriteAllBytes("mmstudio\builder.py", [Convert]::FromBase64String($b64))
          $b64 = @'
          
          '@ -replace "`r|`n", ""
          [IO.File]::WriteAllBytes("runtime\mm_ps5_input.js", [Convert]::FromBase64String($b64))
          $b64 = @'
          
          '@ -replace "`r|`n", ""
          [IO.File]::WriteAllBytes("runtime\mm_ps5_runtime.js", [Convert]::FromBase64String($b64))

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller Pillow

      - name: Build standalone Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "MM-PS5-WEB-APP-STUDIO-v0.1" `
            --add-data "runtime;runtime" `
            "MM-PS5-WEB-APP-STUDIO.py"

      - name: Validate PE executable
        shell: pwsh
        run: |
          $exe = "dist\MM-PS5-WEB-APP-STUDIO-v0.1.exe"
          if (!(Test-Path $exe)) { throw "EXE missing" }
          $bytes = [IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Not a Windows PE/MZ executable" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $exe).Length
          "MM_PS5_WEB_APP_STUDIO_WINDOWS_BUILD=PASS" | Out-File dist\BUILD-INFO.txt -Encoding utf8
          "size=$size" | Add-Content dist\BUILD-INFO.txt
          "sha256=$hash" | Add-Content dist\BUILD-INFO.txt
          Get-Content dist\BUILD-INFO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MM-PS5-WEB-APP-STUDIO-v0.1-WINDOWS
          path: |
            dist/MM-PS5-WEB-APP-STUDIO-v0.1.exe
            dist/BUILD-INFO.txt
          if-no-files-found: error
          compression-level: 0
